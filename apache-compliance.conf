<VirtualHost *:80>
    ServerName contratos.uni.edu.py
    ServerAdmin webmaster@uni.edu.py

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"

    # Max upload size (100MB)
    LimitRequestBody 104857600

    # Enable required modules (run: a2enmod proxy proxy_http proxy_wstunnel headers rewrite)

    # Strapi ALTCHA (captcha) routes - avoid /api/ conflict
    ProxyPass /api/altcha/ http://localhost:1337/api/altcha/
    ProxyPassReverse /api/altcha/ http://localhost:1337/api/altcha/

    # API Backend - Django
    ProxyPass /api/ http://localhost:8000/api/
    ProxyPassReverse /api/ http://localhost:8000/api/
    
    # Admin panel - Django
    ProxyPass /admin/ http://localhost:8000/admin/
    ProxyPassReverse /admin/ http://localhost:8000/admin/

    # Protected media files - requires mod_xsendfile
    # Install: apt install libapache2-mod-xsendfile && a2enmod xsendfile
    # Django serves via /api/media/ with X-Sendfile header pointing to this path
    XSendFile On
    XSendFilePath /opt/projects/Compliance-Tracker/backend/media
    XSendFilePath /app/media

    # Block direct access to /media/ - must go through /api/media/ for auth
    <Location /media/>
        Require all denied
    </Location>

    # Static files - Django (NOT protected, publicly accessible)
    ProxyPass /static/ http://localhost:8000/static/
    ProxyPassReverse /static/ http://localhost:8000/static/

    # Frontend - Next.js/React en puerto 3000
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/

    # WebSocket support for Frontend HMR (desarrollo) y conexiones WebSocket
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://localhost:3000/$1 [P,L]

    # Proxy headers
    ProxyPreserveHost On
    RequestHeader set X-Real-IP %{REMOTE_ADDR}e
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}e
    RequestHeader set X-Forwarded-Proto %{REQUEST_SCHEME}e

    # Timeouts (300 segundos)
    ProxyTimeout 300
    Timeout 300

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/compliance-error.log
    CustomLog ${APACHE_LOG_DIR}/compliance-access.log combined

</VirtualHost>

