events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;
        root         /usr/share/nginx/html;
        index        index.html;

        # index.html tiene nombre fijo y contenido nuevo en cada despliegue. Sin
        # esta línea el navegador lo cachea por heurística y, tras un
        # redespliegue, pide chunks con hashes que ya no existen: la pantalla
        # queda en blanco.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}